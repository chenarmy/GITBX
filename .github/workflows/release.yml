name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis --bundles msi
          - platform: macos-14
            args: --bundles app --bundles dmg
          - platform: ubuntu-22.04
            args: --bundles appimage --bundles deb
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check

      - name: Verify tag version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) { throw "Tag $tagVersion does not match package version $packageVersion" }

      - name: Read release notes
        id: release_notes
        run: node scripts/release-notes.mjs "${{ github.ref_name }}"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GITBX ${{ github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          # Keep partially uploaded releases out of /releases/latest.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish:
    name: Verify and publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify updater assets and publish
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const release = releases.find((candidate) => candidate.tag_name === tag);
            if (!release) {
              core.setFailed(`Unable to find the draft release for ${tag}.`);
              return;
            }
            const names = release.assets.map((asset) => asset.name);
            const required = [
              ['Windows NSIS installer', (name) => /_x64-setup\.exe$/.test(name)],
              ['Windows NSIS signature', (name) => /_x64-setup\.exe\.sig$/.test(name)],
              ['Windows MSI installer', (name) => /_x64_en-US\.msi$/.test(name)],
              ['Windows MSI signature', (name) => /_x64_en-US\.msi\.sig$/.test(name)],
              ['Linux AppImage', (name) => /\.AppImage$/.test(name)],
              ['Linux AppImage signature', (name) => /\.AppImage\.sig$/.test(name)],
              ['Linux DEB', (name) => /\.deb$/.test(name)],
              ['Linux DEB signature', (name) => /\.deb\.sig$/.test(name)],
              ['macOS DMG', (name) => /\.dmg$/.test(name)],
              ['macOS updater bundle', (name) => /\.app\.tar\.gz$/.test(name)],
              ['macOS updater signature', (name) => /\.app\.tar\.gz\.sig$/.test(name)],
              ['latest.json', (name) => name === 'latest.json'],
            ];
            const missing = required.filter(([, matches]) => !names.some(matches)).map(([label]) => label);
            if (missing.length) {
              core.setFailed(`Release remains a draft because assets are missing: ${missing.join(', ')}`);
              return;
            }
            if (names.length !== required.length) {
              core.setFailed(`Release has ${names.length} assets; expected exactly ${required.length}.`);
              return;
            }
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
            core.notice(`Published ${tag} with ${names.length} verified assets.`);

  mirror-cnb:
    name: Mirror release to CNB
    needs: publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CNB_TOKEN: ${{ secrets.CNB }}
      CNB_REPOSITORY: chenarmy/GITBX
    steps:
      - uses: actions/checkout@v4

      - name: Require CNB release credentials
        run: test -n "$CNB_TOKEN" || (echo "Add the CNB_TOKEN Actions secret before publishing a tag." && exit 1)

      - name: Download verified GitHub release assets
        run: gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir release-assets

      - name: Read release notes
        run: node scripts/release-notes.mjs "${{ github.ref_name }}" > cnb-release-notes.md

      - name: Ensure CNB release tag exists
        run: git push "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPOSITORY}.git" "refs/tags/${{ github.ref_name }}"

      - name: Publish signed assets and updater metadata to CNB
        env:
          CNB_RELEASE_TAG: ${{ github.ref_name }}
          CNB_RELEASE_NAME: GITBX ${{ github.ref_name }}
          CNB_RELEASE_BODY_FILE: cnb-release-notes.md
          CNB_ASSET_DIRECTORY: release-assets
        run: node scripts/publish-cnb-release.mjs
