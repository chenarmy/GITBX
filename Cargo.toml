[workspace]
members = [
    "crates/gitbx-contracts",
    "crates/gitbx-core",
    "crates/gitbx-graph",
    "crates/gitbx-diff",
    "crates/gitbx-ai",
    "crates/gitbx-mcp",
    "src-tauri",
    "src-web",
]
resolver = "2"

[workspace.package]
version = "0.1.13"
edition = "2021"
authors = ["GITBX Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/chenarmy/GITBX"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
git2 = { version = "0.19", default-features = false, features = ["https", "ssh"] }
keyring = "2.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
similar = { version = "2.6", features = ["inline"] }
async-trait = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
regex = "1.10"
notify = "6.1"
